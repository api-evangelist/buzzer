name: Buzzer
description: 'Buzzer was a mobile live-sports streaming startup founded in 2020 by Bo Han, formerly director
  of live content at Twitter. Its consumer app, launched in 2021, sold micropayment access — as low as $0.99
  to $1 — to short in-game moments of live sporting events, targeting Gen Z fans who would not buy a full
  cable or league subscription. Buzzer secured streaming rights covering the NBA, WNBA, NHL, PGA Tour and
  ATP Tour, and raised roughly $44 million in total, including a $20 million Series A in June 2021 co-led
  by Sapphire Sport and Canaan Partners alongside a large group of athlete and team-owner investors. On
  19 May 2023 the company shut down the direct-to-consumer app and pivoted to a business-to-business model
  branded "Powered by Buzzer", announced as API licensing, custom development and consulting for leagues,
  teams and networks streaming direct to fans. That offering never reached public availability: Buzzer
  ceased all operations on 30 June 2023, citing "recent fundraising developments and market dynamics".
  No public developer portal, API documentation, specification, SDK or package was ever published. The
  buzzer.com domain no longer hosts the company and now redirects to an Atom.com domain-for-sale listing.
  Retained in the network as a historical record of a defunct company; not an active API provider.'
